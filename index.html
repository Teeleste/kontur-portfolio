<section class="section"><div class="wrap detail-grid"><div class="detail-intro reveal"><div class="eyebrow">Подробно о работах</div><h2>От кабельной трассы до готовой линии</h2><p>Подключаемся к работам на этапе прокладки трасс, монтажа кабельных линий и установки оконечных устройств. Состав работ зависит от проекта и договорённостей на объекте.</p><a class="button ghost" href="#/objects">Посмотреть опыт на объектах ↗</a></div><div class="detail-list">${[['⌁','Структурированные кабельные системы (СКС)','Прокладка UTP и других кабельных линий, установка информационных розеток, монтаж патч-панелей, оконцевание, маркировка и проверка целостности соединений.'],['▦','Контроль доступа (СКУД)','Прокладка кабеля к точкам прохода, считывателям, контроллерам и исполнительным устройствам. Подготовка линий согласно проектной документации.'],['♧','Автоматическая пожарная сигнализация (АПС)','Прокладка кабельных линий и монтажная подготовка для пожарных извещателей, оповещателей и оборудования системы в соответствии с проектом.'],['◉','Охранная сигнализация','Подготовка кабельной инфраструктуры для датчиков движения, открытия, тревожных кнопок и приборов охранной системы.'],['⌗','Маркировка и контроль качества','Проверка линий, маркировка кабелей и точек, выявление ошибок монтажа и подготовка результата к дальнейшему подключению и сдаче.']].map(x=>`<div class="detail-row reveal"><div class="icon">${x[0]}</div><div><h3>${x[1]}</h3><p>${x[2]}</p></div></div>`).join('')}</div></div></section>
<section class="section alt"><div class="wrap"><div class="section-head"><div><div class="eyebrow">Как организуем работу</div><h2>Понятный процесс<br>на каждом этапе</h2></div><p>Согласуем задачу, выполняем монтаж и готовим линии к проверке. Конкретный порядок зависит от условий площадки.</p></div><div class="steps">${[['01','Изучаем задачу','Уточняем проект, объёмы, типы систем и условия работ на объекте.'],['02','Выполняем монтаж','Прокладываем кабель, устанавливаем оконечные устройства, маркируем линии.'],['03','Проверяем результат','Проверяем соединения, устраняем выявленные замечания и передаём выполненный объём.']].map(s=>`<article class="step reveal"><span>${s[0]} / ЭТАП</span><h3>${s[1]}</h3><p>${s[2]}</p></article>`).join('')}</div></div></section>
<section class="section"><div class="wrap"><div class="section-head"><div><div class="eyebrow">Практика на объектах</div><h2>Работы в реальных пространствах</h2></div><a class="button ghost" href="#/objects">Все объекты ↗</a></div><div class="projects">${Object.entries(projects).map(([k,p])=>projectCard(k,p)).join('')}</div></div></section>${contact()}`}
function objectsPage(){return `<section class="page-hero"><div class="wrap"><div class="eyebrow">Портфолио</div><h1>Объекты, на которых<br><em style="color:light-dark(#507465,#b5d59b)">мы работали</em></h1><p>Примеры выполненных монтажных работ на общественных и коммерческих объектах. Откройте карточку, чтобы посмотреть состав работ и фотогалерею.</p></div></section><section class="section" style="padding-top:20px"><div class="wrap"><div class="projects">${Object.entries(projects).map(([k,p])=>projectCard(k,p)).join('')}</div><p class="notice">Фотографии на этой демонстрационной версии — иллюстративные. Перед публикацией замените их реальными снимками вашей команды и уточните перечень фактически выполненных работ.</p></div></section>${contact()}`}
function projectPage(key,p){return `<section class="page-hero"><div class="wrap"><div class="breadcrumbs"><a href="#/">Главная</a> / <a href="#/objects">Объекты</a> / ${p.name}</div><div class="page-hero-grid"><div><div class="eyebrow">${p.kind}</div><h1>${p.name}</h1><p>${p.lead}</p><a class="button lime" href="#gallery">Фотографии работ ↓</a></div><img class="page-photo" src="${p.image}" alt="Иллюстрация: ${p.name}"></div><div class="facts">${p.facts.map(f=>`<div class="fact"><b>${f[0]}</b><span>${f[1]}</span></div>`).join('')}</div></div></section><section class="section alt"><div class="wrap"><div class="section-head"><div><div class="eyebrow">Состав работ</div><h2>Что было выполнено</h2></div><p></p></div><div class="checklist">${p.tasks.map(t=>`<div class="check reveal"><i>✓</i><span>${t}</span></div>`).join('')}</div></div></section><section class="section" id="gallery"><div class="wrap"><div class="section-head"><div><div class="eyebrow">Фотогалерея</div><h2>Рабочие моменты</h2></div><p></p></div><div class="work-gallery">${p.gallery.map((g,i)=>`<figure class="work-shot reveal"><img src="${g[2]}" alt="${g[0]} — ${p.name}" loading="lazy"><figcaption><strong>0${i+1} / ${g[0]}</strong><span>${g[1]}</span></figcaption></figure>`).join('')}</div><p class="notice"></p><div style="margin-top:28px"><a class="button ghost" href="#/objects">← Вернуться ко всем объектам</a></div></div></section>${contact()}`}
function render(){let route=location.hash.replace(/^#\/?/,'');let html=route==='objects'?objectsPage():projects[route]?projectPage(route,projects[route]):home();document.getElementById('app').innerHTML=html;document.querySelectorAll('.navlinks a').forEach(a=>a.classList.toggle('active',a.getAttribute('href')===`#/${route}`||(route===''&&a.getAttribute('href')==='#/')));document.querySelector('.navlinks').classList.remove('open');observe();window.scrollTo({top:0,behavior:'smooth'});}
function observe(){const els=document.querySelectorAll('.reveal');if(!('IntersectionObserver'in window)){els.forEach(e=>e.classList.add('visible'));return}const io=new IntersectionObserver(entries=>entries.forEach(en=>{if(en.isIntersecting){en.target.classList.add('visible');io.unobserve(en.target)}}),{threshold:.12});els.forEach(e=>io.observe(e))}
const contactEmail='gnu4y.nikita2014@gmail.com';
function updateContactDetails(){const nav=document.querySelector('.nav-cta');if(nav){nav.href='mailto:'+contactEmail;nav.textContent='Почта для связи: '+contactEmail;nav.style.cssText='background:none;padding:0;border:0;color:var(--ink);font-weight:700;font-size:12px;white-space:nowrap';nav.classList.remove('nav-cta')}document.querySelectorAll('#app .notice').forEach(el=>el.remove());document.querySelectorAll('#app a.button').forEach(link=>{if(link.textContent.includes('Связаться с нами')){const email=document.createElement('a');email.href='mailto:'+contactEmail;email.textContent='Почта для связи: '+contactEmail;email.style.cssText='color:var(--ink);font-weight:700;overflow-wrap:anywhere';link.replaceWith(email)}})}
const contactObserver=new MutationObserver(updateContactDetails);contactObserver.observe(document.getElementById('app'),{childList:true,subtree:true});updateContactDetails();
window.addEventListener('hashchange',render);document.getElementById('year').textContent=new Date().getFullYear();render();
</script></body></html>
